[project]
name = "local-rag-service"
version = "0.1.0"
description = "Local-first, traceable RAG service for the AI digital-operations system"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
  "deepagents==0.7.9",
  "fastapi>=0.116,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "jieba>=0.42,<1",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=0.3,<2",
  "numpy>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.14,<2",
  "rank-bm25>=0.2,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
